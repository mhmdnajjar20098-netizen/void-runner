<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Void Runner</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Tajawal:wght@500;700&display=swap"><style>
/* Layout: full-bleed canvas stage. Menus are centered glass panels over the live starfield. HUD is drawn on the canvas; pause and boost buttons float in the corners. */
:root{
  --bg:#04050c; --ink:#e8edff; --dim:#8f9bc7; --line:#2b3562;
  --panel:rgba(10,14,30,.92); --panel-hi:rgba(28,36,70,.95);
  --accent:#ffb02e; --accent-ink:#1a1204; --info:#52c8ff; --good:#4ee6a0; --bad:#ff5a6e; --gem:#c79bff;
  --display:'Chakra Petch','Tajawal',system-ui,sans-serif;
  --glass:rgba(11,15,38,.66); --glass-b:rgba(130,150,255,.22);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[dir=rtl] *{letter-spacing:0!important}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
body.gl3 #gl{display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 38%,rgba(4,5,12,.18),rgba(4,5,12,.8));animation:fade .35s ease both}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 60%,#14204a 0%,#070a1c 55%,#03040a 100%);overflow:hidden;transition:opacity .9s ease,transform .9s ease;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .stars{position:absolute;inset:-50% 0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 80px 120px,#bcd,transparent),radial-gradient(1.5px 1.5px at 150px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 170px,#9bf,transparent),radial-gradient(1px 1px at 40px 200px,#fff,transparent);background-size:240px 240px;animation:sps 5s linear infinite;opacity:.8}
@keyframes sps{to{transform:translateY(240px)}}
#splash .ship{width:84px;height:84px;color:#ffc24d;filter:drop-shadow(0 0 18px rgba(255,170,60,.7));animation:shipIn 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes shipIn{from{transform:translateY(120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
#splash h1{margin:0;font-size:32px;letter-spacing:.26em;padding-left:.26em;font-weight:700;background:linear-gradient(180deg,#fff,#9fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoIn 1.8s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoIn{from{opacity:0;letter-spacing:.8em;filter:blur(8px)}to{opacity:1;letter-spacing:.26em;filter:none}}
#splash .tag{font-size:13px;color:#a9b6ec;letter-spacing:.08em;animation:fade 1.2s 1.5s both}
#splash .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:18px;animation:fade .6s 1.2s both}
#splash .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb02e,#ffe08a);transform-origin:left;animation:barF 2.2s 1.2s ease-out both}
@keyframes barF{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#splash .tap{font-size:12px;color:#ffd48a;letter-spacing:.2em;text-transform:uppercase;animation:fade .6s 3.4s both,tapP 1.4s 3.4s ease-in-out infinite}
@keyframes tapP{50%{opacity:.35}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,46,.5),0 8px 28px rgba(255,150,20,.35)}50%{box-shadow:0 0 0 10px rgba(255,176,46,0),0 8px 34px rgba(255,150,20,.55)}}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 2px rgba(255,176,46,.5),0 0 14px rgba(255,176,46,.3)}50%{box-shadow:0 0 0 3px rgba(255,176,46,.8),0 0 24px rgba(255,176,46,.6)}}
@keyframes shine{0%{transform:translateX(-160%) skewX(-20deg)}60%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035);box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(255,176,46,.4)}100%{transform:scale(1)}}
@keyframes starIn{0%{transform:scale(2.6) rotate(-40deg);opacity:0}60%{transform:scale(.88) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.panel{width:min(100%,460px);max-height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:12px;min-width:0;padding:20px 18px;border-radius:22px;border:1px solid var(--glass-b);background:linear-gradient(180deg,rgba(26,33,72,.84),rgba(10,13,32,.9));box-shadow:0 26px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fade .3s ease both}
.panel::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:0;height:0}
.panel.fixed{height:min(100%,820px);overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding-block:2px}
.panel>*,.menu-actions>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.panel>*:nth-child(1),.menu-actions>*:nth-child(1){animation-delay:.04s}
.panel>*:nth-child(2),.menu-actions>*:nth-child(2){animation-delay:.09s}
.panel>*:nth-child(3),.menu-actions>*:nth-child(3){animation-delay:.14s}
.panel>*:nth-child(4),.menu-actions>*:nth-child(4){animation-delay:.19s}
.panel>*:nth-child(5){animation-delay:.24s}
.panel>*:nth-child(6){animation-delay:.29s}
.panel>*:nth-child(n+7){animation-delay:.34s}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.05em}
.tag{margin:0;text-align:center;color:var(--dim)}
.sub{color:var(--dim);font-size:13px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
svg{display:block;flex:none}
[dir=rtl] .ic-back,[dir=rtl] .ic-play{transform:scaleX(-1)}
/* main menu */
#s-main{justify-content:space-between;gap:12px}
.topbar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:8px;animation:rise .5s both}
.wallet{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);font-weight:700;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb02e 60%,#b8741a);flex:none}
.gem{display:inline-block;width:11px;height:11px;background:linear-gradient(135deg,#ecd8ff,#a56bff);transform:rotate(45deg);flex:none;margin-inline:2px}
.menu-mid{display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both}
.logo{font-weight:700;font-size:clamp(34px,11vw,54px);letter-spacing:.16em;line-height:1.05;text-transform:uppercase;text-align:center;background:linear-gradient(180deg,#fff 20%,#ffc24d 75%,#ff8a1f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-block:4px;filter:drop-shadow(0 4px 22px rgba(255,150,20,.35))}
.menu-actions{width:min(100%,400px);display:flex;flex-direction:column;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px var(--display);letter-spacing:.04em;color:var(--ink);padding:13px 16px;min-height:50px;border-radius:14px;border:1px solid var(--glass-b);background:linear-gradient(180deg,rgba(62,76,146,.55),rgba(30,38,88,.72));cursor:pointer;text-align:center;transition:transform .15s cubic-bezier(.2,.8,.2,1),filter .15s,border-color .15s}
.btn:hover{filter:brightness(1.18);border-color:rgba(170,185,255,.5)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.tab:focus-visible,.lv:focus-visible,.sw:focus-visible,.seg button:focus-visible,.buy:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604;border-color:rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(255,150,20,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.primary::after{content:"";position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 3.6s ease-in-out 1.2s infinite;pointer-events:none}
.btn.xl{min-height:66px;font-size:21px;letter-spacing:.14em;border-radius:20px;text-transform:uppercase}
.menu-actions>.btn.xl{animation:rise .5s .04s cubic-bezier(.2,.8,.2,1) both,pulse 2.4s 1s ease-in-out infinite}
.btn.danger{border-color:rgba(255,90,110,.6);color:#ff8f9f;background:linear-gradient(180deg,rgba(120,30,50,.35),rgba(60,14,30,.5))}
.btn.small{min-height:42px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.icon{min-height:42px;width:42px;padding:0;border-radius:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.tile{flex-direction:column;gap:8px;padding:14px 6px;min-height:84px;font-size:13px;letter-spacing:.06em;border-radius:16px}
.tile svg{width:26px;height:26px;color:#ffc24d}
.langchip{min-width:96px}
.ic{display:inline-flex}
/* level select */
.sector{--h:210;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(180deg,hsla(var(--h),60%,40%,.18),hsla(var(--h),60%,20%,.1));border:1px solid hsla(var(--h),60%,62%,.22)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:hsl(var(--h),75%,80%)}
.sec-h b{letter-spacing:.1em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;padding:0;border-radius:12px;border:1px solid hsla(var(--h),60%,66%,.3);background:linear-gradient(180deg,hsla(var(--h),55%,46%,.42),hsla(var(--h),55%,22%,.55));color:var(--ink);font:700 16px var(--display);cursor:pointer;transition:transform .15s,filter .15s;font-variant-numeric:tabular-nums}
.lv:hover{filter:brightness(1.25)}
.lv:active{transform:scale(.93)}
.lv .ss{display:flex;gap:2px;height:7px}
.lv .ss i{width:7px;height:7px;background:#3a4478;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.lv .ss i.on{background:#ffb02e}
.lv.boss{border-color:rgba(255,100,120,.75);background:linear-gradient(180deg,rgba(255,90,110,.36),rgba(120,20,40,.55));box-shadow:0 0 14px rgba(255,90,110,.28)}
.lv.boss::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;background:#ff5a6e;transform:rotate(45deg)}
.lv.cur{border-color:#ffb02e;animation:pulse2 2s ease-in-out infinite}
.lv[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.lv svg{width:18px;height:18px;color:var(--dim)}
/* shop */
.prevrow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;border:1px solid var(--glass-b);background:linear-gradient(180deg,#0a0e26,#141d46)}
#prev{width:46%;max-width:210px;height:auto;aspect-ratio:480/280;display:block;border-radius:12px}
.pstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.tier{font-weight:700;font-size:15px;letter-spacing:.06em;color:#ffd48a}
.ps{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:#222b52;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffb02e,#ffd48a);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(10,13,36,.7);border:1px solid var(--glass-b)}
.tab{flex:1;font:700 14px var(--display);padding:10px;border-radius:10px;border:0;background:transparent;color:var(--dim);cursor:pointer;min-height:42px;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(40,52,110,.3);border:1px solid rgba(130,150,255,.15)}
.lore{margin:0;text-align:center;font-size:13px;line-height:1.55;color:#c9d4ff;font-style:italic;padding:0 6px}
.cx{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(40,52,110,.3);border:1px solid rgba(130,150,255,.15)}
.cx canvas{flex:none;width:92px;height:92px;border-radius:12px;background:radial-gradient(circle,rgba(70,90,200,.25),rgba(5,8,24,.4))}
.cx h3{margin:0;font-size:16px}.cx .ep{font-size:12px;color:#ffd48a;margin:2px 0 6px}.cx p{margin:0 0 4px;font-size:12px;line-height:1.5;color:#c9d4ff}.cx p b{color:#fff}
.cx.lock{opacity:.7}
.card.pop{animation:pop .5s ease}
.ci{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,176,46,.26),rgba(255,176,46,.06));color:#ffc24d;border:1px solid rgba(255,176,46,.25)}
.ci svg{width:24px;height:24px}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cm b{font-size:16px}
.pips{display:flex;gap:3px;margin-top:3px}
.pip{flex:1;height:5px;border-radius:3px;background:#222b52;max-width:22px}
.gate{margin-top:4px;font-size:11px;color:#8f9bd0}.gate.ok{color:#7fe8b5}
.pip.on{background:linear-gradient(90deg,#ffb02e,#ffd48a)}
.buy{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:88px;min-height:44px;padding:8px 12px;font:700 15px var(--display);border-radius:12px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .15s,filter .15s}
.buy:active{transform:scale(.94)}
.buy[disabled]{cursor:not-allowed;background:rgba(60,72,130,.45);color:var(--dim);border-color:var(--glass-b)}
.buy.owned{background:rgba(78,230,160,.16);color:var(--good);border-color:rgba(78,230,160,.4)}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid rgba(130,150,255,.13)}
.srow b{font-size:16px}
.sel{max-width:60%;min-height:40px;padding:6px 10px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(40,50,104,.65);color:#eaf0ff;font:inherit;font-size:14px}
.sel option{background:#1b2252;color:#eaf0ff}
.sw{position:relative;flex:none;width:56px;height:32px;padding:0;border-radius:999px;border:1px solid var(--glass-b);background:rgba(40,50,104,.65);cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#cfd8ff;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .25s}
.sw[aria-checked=true]{background:linear-gradient(180deg,#ffc84f,#ff981c)}
.sw[aria-checked=true]::after{transform:translateX(24px);background:#fff}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-24px)}
.seg{display:inline-flex;border:1px solid var(--glass-b);border-radius:12px;overflow:hidden}
.seg button{font:700 14px var(--display);padding:9px 14px;min-height:40px;background:transparent;color:var(--dim);border:0;cursor:pointer;transition:background .2s,color .2s}
#seg-gfx button{padding:9px 8px;font-size:13px}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:6px;border-radius:3px;background:rgba(70,84,156,.7);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#ffb02e;border:2px solid #fff;box-shadow:0 0 12px rgba(255,176,46,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#ffb02e;border:2px solid #fff;box-shadow:0 0 12px rgba(255,176,46,.6);cursor:pointer}
/* results */
.kicker{text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#ffd48a}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:4px 0 8px}
.stars i{display:block;width:46px;height:46px;background:linear-gradient(180deg,#ffe08a,#ff9a1f);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);filter:drop-shadow(0 0 8px rgba(255,176,46,.6));animation:starIn .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.stars i:nth-child(2){width:58px;height:58px}
.stars i.off{background:#2a3166;filter:none}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid rgba(130,150,255,.13);font-variant-numeric:tabular-nums}
.stat b{display:inline-flex;align-items:center;gap:6px}
.big{font-size:clamp(24px,7vw,30px)}
.adbar{height:10px;border-radius:5px;background:#222b52;overflow:hidden}
.adbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#52c8ff,#9be2ff);transition:width 1s linear}
/* arsenal, chests, daily */
.cbtns{flex:none;display:flex;flex-direction:column;gap:6px}
.buy.ad{background:linear-gradient(180deg,#7ad8ff,#3fa6e6);color:#06223a}
.shead{margin-top:6px;padding:0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffd48a}
.cship{flex:none;width:58px;height:58px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#1d2760,#0a0e26);border:1px solid var(--glass-b)}
.card.free{background:linear-gradient(90deg,rgba(63,166,230,.18),rgba(40,52,110,.3));border-color:rgba(122,216,255,.3)}
.loadout{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);font:700 13px var(--display);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lchip svg{width:18px;height:18px;color:#ffc24d}
.buffs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.bchip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#d9c2ff;background:rgba(160,110,255,.16);border:1px solid rgba(190,150,255,.4)}
.btn.chestbtn{min-height:56px;background:linear-gradient(180deg,#c79bff,#8a5cf0);color:#1a0b3a;border-color:rgba(255,255,255,.4);box-shadow:0 8px 26px rgba(150,100,255,.4);animation:pulse 2.2s ease-in-out infinite}
.btn.chestbtn svg{width:24px;height:24px}
.chestpanel{align-items:stretch}
.chestwrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:210px}
.rays{position:absolute;width:300px;height:300px;border-radius:50%;opacity:0;transition:opacity .5s;background:conic-gradient(from 0deg,rgba(255,224,138,.0),rgba(255,224,138,.5),rgba(255,224,138,0) 12%,rgba(255,224,138,.5) 25%,rgba(255,224,138,0) 37%,rgba(255,224,138,.5) 50%,rgba(255,224,138,0) 62%,rgba(255,224,138,.5) 75%,rgba(255,224,138,0) 87%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 8s linear infinite;pointer-events:none}
.rays.on{opacity:1}

#s-chest{padding:0;background:radial-gradient(ellipse at 50% 45%,rgba(40,24,80,.55),rgba(4,5,12,.94))}
#chCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#chUi{position:relative;z-index:2;width:min(100%,460px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);pointer-events:none}
#chUi h2{margin:0;text-align:center;font-size:26px;transition:opacity .6s;text-shadow:0 0 24px rgba(255,200,90,.7)}
#chUi .chbottom{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;min-height:130px;justify-content:flex-end}
#chUi button{pointer-events:auto}
#ch-sub{min-height:22px;font-weight:700;color:#ffe3a3;animation:blinkc 1.4s ease-in-out infinite}
@keyframes blinkc{0%,100%{opacity:.55}50%{opacity:1}}
#rwWrap{position:absolute;left:0;right:0;top:40%;display:flex;justify-content:center;z-index:3;pointer-events:none}
#rwWrap .reward{position:relative}
.reward.shipname{background:none;border:0;box-shadow:none;padding:0;min-width:0;text-shadow:0 0 18px var(--rc,#fff),0 2px 8px #000}
.reward.shipname .big{font-size:30px;color:#fff}
.freshbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:8px 14px;border-radius:14px;border:1px dashed rgba(255,176,46,.55);background:rgba(255,176,46,.08);color:#ffd48a;font-weight:700;font-size:14px}
.adminbtn{border-color:rgba(125,240,255,.55);background:rgba(125,240,255,.08);color:#aeeeff}
.adminbtn .lbadge{background:linear-gradient(180deg,#3fc1e6,#2276b8)}
.lbadge{padding:3px 9px;border-radius:999px;background:linear-gradient(180deg,#ff7a5a,#d63a3a);color:#fff;font-size:10px;letter-spacing:.12em;font-weight:800;animation:blinkc 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shakec{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.03)}40%{transform:rotate(6deg) scale(1.05)}60%{transform:rotate(-8deg) scale(1.06)}80%{transform:rotate(7deg) scale(1.04)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes revealIn{0%{transform:scale(.3) translateY(30px);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.chest{position:relative;animation:floaty 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 24px rgba(255,176,46,.35))}
.chest.shake{animation:shakec .9s ease-in-out}
.clid{transform-box:view-box;transform-origin:20px 52px;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.chest.open{animation:none;opacity:.0;transform:scale(.6) translateY(40px);transition:opacity .5s .2s,transform .5s .2s}
.chest.open .clid{transform:rotate(-40deg)}
.reward{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px 18px;border-radius:20px;min-width:220px;max-width:92%;background:linear-gradient(180deg,rgba(30,38,86,.96),rgba(12,16,40,.96));border:2px solid var(--rc,#52c8ff);box-shadow:0 0 40px var(--rc,#52c8ff);animation:revealIn .6s cubic-bezier(.2,.9,.3,1.2) both}
.reward .rwic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--rc);background:rgba(255,255,255,.06);border:1px solid var(--rc)}
.reward .rwic svg{width:36px;height:36px}
.reward .rar{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--rc)}
.reward b{font-size:20px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:8px 4px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(40,52,110,.3);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.day b{font-size:15px;display:inline-flex;align-items:center;gap:4px}
.day svg{width:20px;height:20px;color:#c79bff}
.day.done{opacity:.45}
.day.today{border-color:#ffb02e;box-shadow:0 0 0 2px rgba(255,176,46,.5),0 0 20px rgba(255,176,46,.35);animation:pulse2 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.chest,.rays,.chest.shake{animation:none!important}}
/* in-game controls */
#cineSkip{position:absolute;z-index:40;top:calc(14px + env(safe-area-inset-top,0px));right:14px;padding:9px 16px;border-radius:999px;border:1px solid rgba(190,205,255,.35);background:rgba(8,12,30,.55);color:#e8edff;font:700 13px var(--display);letter-spacing:.08em;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s}
#cineSkip:hover{background:rgba(40,52,110,.7)}
[dir=rtl] #cineSkip,html[lang=ar] #cineSkip{right:auto;left:14px}
body.cine-on #pauseBtn,body.cine-on #boostBtn,body.cine-on #skillBtn{opacity:0;pointer-events:none}
#pauseBtn,#boostBtn,#skillBtn{transition:opacity .4s}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(10,14,34,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0}
#pauseBtn i{display:block;width:4px;height:16px;background:var(--ink);border-radius:2px}
#boostBtn{--p:100%;position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;touch-action:none;color:var(--ink);font:700 13px var(--display);letter-spacing:.1em;background:conic-gradient(var(--accent) var(--p),#232c55 0);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#boostBtn span{display:flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;background:#0c1126}
#boostBtn.on span{background:#3a2a0c;color:#ffd48a}
#skillBtn{--p:100%;--c:#ffd48a;position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;border:0;cursor:pointer;touch-action:none;color:#8f9bc7;background:conic-gradient(var(--c) var(--p),#232c55 0);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#skillBtn span{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#0c1126}
#skillBtn svg{width:32px;height:32px}
#skillBtn.ready{color:var(--c);animation:pulse 1.6s ease-in-out infinite}
#skillBtn.act span{background:#2a2410}
@media (max-height:640px){.stars i{width:38px;height:38px}.stars i:nth-child(2){width:48px;height:48px}.btn.xl{min-height:58px}}
@media (prefers-reduced-motion:reduce){.screen,.panel,.panel>*,.menu-actions>*,.topbar,.menu-mid{animation:none!important}.btn,.lv,.sw::after{transition:none}.btn.primary::after{display:none}}

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c"></canvas>
  <button id="pauseBtn" hidden aria-label="Pause"><i></i><i></i></button>
  <button id="boostBtn" hidden aria-label="Boost"><span data-i="boost">BOOST</span></button>
  <button id="skillBtn" hidden aria-label="Skill"><span></span></button>
  <button id="cineSkip" hidden></button>

  <div id="ui">
    <div id="splash"><div class="stars"></div>
      <svg class="ship" viewBox="0 0 64 64" fill="currentColor"><path d="M32 4l8 22 14 14-4 6-10-4-4 14h-8l-4-14-10 4-4-6 14-14z"/><circle cx="32" cy="26" r="4" fill="#0b1022"/></svg>
      <h1>VOID RUNNER</h1><div class="tag" data-i="splashTag"></div>
      <div class="bar"><i></i></div><div class="tap" data-i="tapStart"></div></div>
    <section class="screen" id="s-main">
      <div class="topbar"><div class="wallet" id="m-wallet"></div><button class="btn small langchip" id="b-lang"></button></div>
      <div class="menu-mid">
        <div class="logo" data-i="title"></div>
        <p class="tag" data-i="tagline"></p>
        <div class="buffs" id="m-buffs"></div>
      </div>
      <div style="flex:1"></div>
      <div class="menu-actions">
        <button class="btn chestbtn" id="b-chest" hidden></button>
        <div class="loadout" id="m-load"></div>
        <button class="btn primary xl" id="b-play"></button>
        <div class="row3">
          <button class="btn tile" id="b-levels"><span class="ic" data-ic="levels"></span><span data-i="levelsShort"></span></button>
          <button class="btn tile" id="b-shop"><span class="ic" data-ic="shop"></span><span data-i="shopShort"></span></button>
          <button class="btn tile" id="b-set"><span class="ic" data-ic="settings"></span><span data-i="settings"></span></button>
        </div>
        <button class="btn freshbtn" id="b-fresh"><span id="fresh-t"></span><span class="lbadge" id="fresh-b">LIMITED TIME</span></button>
        <button class="btn freshbtn adminbtn" id="b-admin"><span id="admin-t"></span><span class="lbadge" id="admin-b">TEMPORARY</span></button>
      </div>
    </section>

    <section class="screen" id="s-levels" hidden>
      <div class="panel fixed">
        <div class="head"><h2 data-i="levels"></h2><div style="display:flex;gap:8px"><button class="btn icon" id="b-codex" aria-label="Archive"><span class="ic" data-ic="book"></span></button><button class="btn icon" data-back="main"><span class="ic" data-ic="back"></span></button></div></div>
        <div class="sub" data-i="levelsHint"></div>
        <div class="scroll" id="lvScroll"></div>
      </div>
    </section>

    <section class="screen" id="s-codex" hidden>
      <div class="panel fixed">
        <div class="head"><h2 data-i="codex"></h2><button class="btn icon" data-back="levels"><span class="ic" data-ic="back"></span></button></div>
        <div class="sub" data-i="codexHint"></div>
        <div class="scroll" id="cxScroll"></div>
      </div>
    </section>



    <section class="screen" id="s-shop" hidden>
      <div class="panel fixed">
        <div class="head"><h2 data-i="shop"></h2><div class="wallet" id="shopWallet"></div></div>
        <div class="prevrow"><canvas id="prev" width="480" height="280"></canvas><div class="pstats" id="pstats"></div></div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-up" aria-selected="true" data-i="tabUp"></button>
          <button class="tab" role="tab" id="tab-ar" aria-selected="false" data-i="tabArsenal"></button>
          <button class="tab" role="tab" id="tab-pl" aria-selected="false" data-i="tabPilots"></button>

        <button class="btn" id="shopBack"><span class="ic" data-ic="back"></span><span data-i="back"></span></button>
      </div>
    </section>

    <section class="screen" id="s-set" hidden>
      <div class="panel">
        <div class="head"><h2 data-i="settings"></h2></div>
        <div class="srow"><b data-i="sound"></b><button class="sw" id="t-sfx" role="switch" aria-checked="true"></button></div>
        <div class="srow"><b data-i="volume"></b><input type="range" id="r-vol" min="0" max="100" step="5" aria-label="Volume"></div>
        <div class="srow"><b data-i="vibration"></b><button class="sw" id="t-vib" role="switch" aria-checked="true"></button></div>
        <div class="srow"><b data-i="shake"></b><button class="sw" id="t-shake" role="switch" aria-checked="true"></button></div>
        <div class="srow"><b data-i="gfx"></b><div class="seg" id="seg-gfx"><button data-g="auto" data-i="gfxAuto"></button><button data-g="high" data-i="gfxHigh"></button><button data-g="low" data-i="gfxLow"></button><button data-g="2d" data-i="gfx2d"></button></div></div>
        <div class="srow"><b data-i="setCine"></b><button class="sw" id="t-cine" role="switch" aria-checked="true"></button></div>
        <div class="srow" id="r-nar"><b data-i="setNar"></b><button class="sw" id="t-nar" role="switch" aria-checked="true"></button></div>
        <div class="srow" id="r-nar2"><span id="narStat" style="font-size:13px;opacity:.75;line-height:1.35"></span><button class="btn small" id="b-nartest" data-i="narTest"></button></div>
        <div class="row3" style="grid-template-columns:1fr 1fr"><button class="btn small" id="b-wopen" data-i="setOpen"></button><button class="btn small" id="b-wend" data-i="setEnd"></button></div>
        <div class="srow"><b data-i="language"></b><div class="seg" id="seg-lang"><button data-lang="en" dir="ltr">English</button><button data-lang="ar" dir="rtl">العربية</button></div></div>
        <button class="btn danger" id="b-reset"></button>
        <button class="btn" id="setBack"><span class="ic" data-ic="back"></span><span data-i="back"></span></button>
      </div>
    </section>

    <section class="screen" id="s-pause" hidden>
      <div class="panel">
        <h2 data-i="paused"></h2>
        <button class="btn primary" id="p-resume"><span class="ic" data-ic="play"></span><span data-i="resume"></span></button>
        <button class="btn" id="p-restart" data-i="restart"></button>
        <button class="btn" id="p-set" data-i="settings"></button>
        <button class="btn" id="p-menu" data-i="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-revive" hidden>
      <div class="panel">
        <h2 data-i="destroyed"></h2>
        <div class="sub" id="rv-info"></div>
        <button class="btn primary" id="rv-ad"></button>
        <button class="btn" id="rv-coin"></button>
        <button class="btn" id="rv-quit" data-i="giveUp"></button>
      </div>
    </section>

    <section class="screen" id="s-ad" hidden>
      <div class="panel">
        <h2 data-i="adTitle"></h2>
        <div class="sub" id="ad-sub"></div>
        <div class="adbar"><i id="ad-fill"></i></div>
      </div>
    </section>

    <section class="screen" id="s-lost" hidden>
      <div class="panel">
        <h2 data-i="destroyed"></h2>
        <div id="lostStats"></div>
        <button class="btn primary" id="l-retry" data-i="retry"></button>
        <button class="btn" id="l-shop" data-i="shop"></button>
        <button class="btn" id="l-menu" data-i="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-done" hidden>
      <div class="panel">
        <div class="kicker" id="d-kicker"></div>
        <h2 class="big" id="d-title" style="text-align:center"></h2>
        <div class="stars" id="d-stars"></div>
        <div id="doneStats"></div>
        <button class="btn chestbtn" id="d-chest" hidden></button>
        <button class="btn primary" id="d-next"><span data-i="next"></span><span class="ic" data-ic="play"></span></button>
        <div class="row3" style="grid-template-columns:1fr 1fr">
          <button class="btn small" id="d-shop" data-i="shop"></button>
          <button class="btn small" id="d-menu" data-i="menu"></button>
        </div>
      </div>
    </section>

    <section class="screen" id="s-chest" hidden>
      <canvas id="chCv"></canvas>
      <div id="chUi">
        <h2 id="ch-title"></h2>
        <div class="chbottom">
          <div class="sub" id="ch-sub"></div>
          <button class="btn primary" id="ch-open" hidden></button>
          <button class="btn" id="ch-back" hidden></button>
        </div>
      </div>
      <div id="rwWrap"><div class="reward" id="reward" hidden></div></div>
    </section>

    <section class="screen" id="s-daily" hidden>
      <div class="panel">
        <div class="kicker" data-i="daily"></div>
        <h2 id="dl-title" style="text-align:center"></h2>
        <div class="sub" data-i="dailyD" style="text-align:center"></div>
        <div class="days" id="dl-days"></div>
        <button class="btn primary" id="dl-claim" data-i="claim"></button>
      </div>
    </section>

    <section class="screen" id="s-over" hidden>
      <div class="panel">
        <div class="logo" data-i="victory"></div>
        <p class="tag" data-i="victoryText"></p>
        <div class="stars" id="o-stars"></div>
        <div id="overStats"></div>
        <button class="btn primary" id="o-shop" data-i="shop"></button>
        <button class="btn" id="o-menu" data-i="menu"></button>
      </div>
    </section>
  </div>

}

bossLore:[{"e": "Gatekeeper of the Scrapyard", "i": "A guard machine of the old Choir. It still slams shut on anything that moves.", "o": "Its plates rust shut. Beyond the scrapyard, the first lights of the road appear."}, {"e": "The Drill That Counts", "i": "It spins, counting intruders. The number is never zero.", "o": "Its count ends at one: you. The swarm goes quiet."}, {"e": "Lullaby of Steel", "i": "It broadcasts the Choir's hush-signal. Every engine nearby falls asleep. Yours won't.", "o": "The signal breaks mid-pulse. Somewhere, a very old door unlocks."}, {"e": "The Last Heir of Embers", "i": "A crown of fire on a king no one remembers. It guards a throne with no kingdom.", "o": "The crown cools to ash. You carry its last spark forward."}, {"e": "It Swallowed a Star", "i": "A husk that ate a dying sun to stay alive. It is still hungry.", "o": "The stolen light bleeds out and joins your Ember Seed."}, {"e": "Warden of the Drowned Lane", "i": "Its tides are made of plasma. It never lets a ship pass twice.", "o": "The tide recedes. The lane is open, and silent."}, {"e": "The Ship That Never Landed", "i": "Once a Runner ship, like yours. Now a flicker between two places.", "o": "It looks back at you, just once, then fades. It was thanking you."}, {"e": "Needle of the Old Watch", "i": "A tower that learned to walk. It still believes the war is on.", "o": "The tower folds. Its beacon points toward the Gate."}, {"e": "The Lens That Reads You", "i": "It records every move you make and learns. Do not repeat yourself.", "o": "The lens goes dark. For the first time, nothing is watching."}, {"e": "Orbit of the Sick Moon", "i": "A moon the Choir tried to cure. The cure became the disease.", "o": "The glow settles. A little green returns to the dark."}, {"e": "Chrome Tide, Deep Hunter", "i": "Older than the Gate itself. It crossed a hundred wars to find prey.", "o": "The dreadnought drifts into the dark, and finally rests."}, {"e": "Sovereign of Cinders", "i": "It ruled Solenne's last city. When the star dimmed, it burned the rest.", "o": "The throne collapses. Its flames hand you their warmth."}, {"e": "Harvester of Quiet Glass", "i": "Every shard is a Runner it caught. They glitter where they fell.", "o": "The shards fall away, and one of them hums your name."}, {"e": "Anvil of the Storm", "i": "Lightning is forged here, one blow at a time. Count the strikes.", "o": "The anvil cracks. The storm moves on without it."}, {"e": "The Pale Fortress", "i": "So large it has its own weather. It does not hate you; it simply cannot stop.", "o": "The fortress gate opens. Inside lies a map to the Gate."}, {"e": "Loom of the Empty Threads", "i": "It weaves the paths you fly. Every thread is a choice it already made.", "o": "The threads snap. For once the road is yours to choose."}, {"e": "Sun Tyrant", "i": "It bottled a sun and called it power. The light is not warm; it is bright.", "o": "The false sun goes out. Solenne's real light feels closer."}, {"e": "The Lamp Without a Flame", "i": "It lights the way for lost ships, then leads them into the dark.", "o": "The lantern shatters. Starlight comes through the cracks."}, {"e": "Warden of the Hex-Gate", "i": "The Gate's last guard. Every cell holds a Runner's lost wingman.", "o": "The hexes go dark, one by one, together at last."}, {"e": "All the Runners Who Failed", "i": "Every Runner before you, their last signals woven into one machine. It is not an enemy. It is a test.", "o": "The Echo fades into light. You light the Gate; Solenne shines again."}],
splashTag:'Reach the Gate. Relight the star.',tapStart:'Tap to start',codex:'Archive',codexHint:'Every boss you defeat is recorded here with its story.',cxLocked:'Defeat the boss of level {n} to reveal it.',cxIntro:'Before the fight',cxOutro:'After the fall',begin:'Begin',prologueTitle:'The Last Runner',
prologue:['The star Solenne is dying. Its light, the last warmth of the Cradle, is fading.','Long ago a gate was built to relight it: the Meridian Gate.','But the Choir, an ancient defense network, still guards it. Its machines forgot what they protect.','You are Runner Zero. You carry the Ember Seed. Reach the Gate. Light it.'],
cnOpen:["Solenne. The last star of the Cradle.","Its light is failing. When it dies, so does everything we built.","Others tried to reach the Meridian Gate before you.","None came back.","The Gate can relight the star.","But the Choir still guards it.","Its machines forgot what they protect.","You are Runner Zero.","You carry the Ember Seed. One spark. One chance.","Runner Zero, launch is clear. Fly forward. Don't look back."],
cnEnd:["It was never an enemy.","It was a test.","Every Runner before you, waiting to see if someone would make it.","They did not fail. They carried you here.","Runner Zero... light the Gate.","Now.","Solenne shines again.","The Cradle will remember every Runner.","THE END"],

hyLight:'Solenne light {n}%',hyDown:'TARGET DESTROYED',hyClose:'CLOSE!',hyLast:'FINISH IT!',hyPerfect:'PERFECT',hyCombo:'COMBO x{n}',hyPU:{shield_cyan:'SHIELD',shield_magenta:'THORN SHIELD',shield_gold:'INVINCIBLE',shield_green:'REPAIR SHIELD',multi:'MULTI-SHOT',rapid:'RAPID FIRE',speed:'SPEED UP',heal:'REPAIR'},tactics:["Laser gates drop with one gap. Line up with the gap before the bar lands.", "Spinning blades fly to the red circles, hang, then return. Dodge them both ways.", "Silence rings jam your guns. Slip through the gap in the ring.", "Fire pools burn where the red circles are. Never park on one.", "A black hole drags you in. Fly away from it and keep out of the core.", "A current shoves you sideways as waves roll in. Fight it to the gap.", "It seeds mines around you. Shoot them to defuse, or leave the blast circle.", "A railgun beam tracks you, freezes, then fires. Step aside the moment it freezes.", "Its mirror throws your shots back. Dodge them and fire when the mirror drops.", "Spiked moons spiral out from it like a galaxy. Weave between the arms.", "Torpedoes chase you. Shoot them down or turn sharply.", "Boulders drop down red columns. Leave the column before it lands.", "A prism beam sweeps and bounces off the walls. Leave the red wedge.", "Lightning hits the red columns and leaves a shock field. Avoid both.", "Shield pylons guard it. Destroy them first, or your shots barely scratch it.", "A laser web lights up in red. Stand in a cell, never on a thread.", "Solar arms spin around it. Ride the wedge between them.", "Its searchlight hunts you. Keep moving sideways, never sit in the beam.", "A hex cage closes on you. Leave through the green edge.", "Every weapon of the Choir at once. Read each warning. End it, Runner."],bossHi:["Guardian 1 of 20. Wake this road up!", "It's spinning up fast. Hit it before it counts you!", "Its hush-signal is creeping in. Drown it out!", "A crown of fire. Make it kneel!", "It's starving for light. Don't feed it!", "The tide is rising. Ride the gaps!", "A faint Runner beacon blinks inside it. Eyes up!", "An old tower still at war. End it!", "It's learning you. Surprise it!", "Halfway to the Gate. Don't blink now!", "Chrome hunter incoming. Big, not smart!", "A king of cinders. Burn brighter!", "Glass everywhere. Stay sharp, stay moving!", "Storm overhead. Strike before it does!", "A fortress with its own weather. Break it open!", "It weaves your path. Cut the threads!", "A false sun ahead. Don't flinch from the glare!", "It lights the way to nowhere. Don't follow!", "The last guard before the Gate. Give it everything!", "Final contact. Every spark you have. Now!"],bossHo:["Guardian 1 down. Your Seed just got warmer!", "Silence at last. Keep that fire burning!", "Signal dead. Control hears you loud and clear!", "The crown kneels. Four down, sixteen to go!", "The stolen light is free. Your Seed burns brighter!", "Tide broken. Six down, fourteen to go!", "The beacon goes quiet. Somebody was waiting for you.", "Tower down! Eight guardians gone, twelve to go!", "Lens shattered. Nothing is reading you now!", "Halfway done, and still standing. Solenne feels it!", "The hunter finally rests. Eleven down, nine to go!", "Throne in ashes. Twelve down!", "The glass storm is over. Thirteen down, keep going!", "The storm cracks open. The sky is yours!", "Fortress breached. Only five guardians left!", "Threads cut. The Gate feels close!", "False sun out. Solenne's real light is next!", "The lantern breaks. Two guardians left, Runner!", "Last guard down! Only the final contact remains.", "The signal is gone. The Gate is stirring, Runner!"],l1:["Engines hot, road open. Burn through them, Runner!","Every machine you drop gives Solenne a little light back."],ph2c:["Its armor is breaking! Keep the pressure on!", "It's changing pattern. Stay sharp, Runner!", "Good hit! Something inside it is cracking!"],ph3c:["It's going all in! Find the gap and hold it!", "Final stage! Don't flinch, Runner!", "Everything it has is on you now. Move!"],laneOff:"Sensors are overloaded, runner. Safe-lane guides are offline from here. Read the patterns yourself.",ctlName:"SOLENNE CONTROL",tacName:"TACTICAL",contact:"CONTACT",

const stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
let W=400,H=720,scale=1,offX=0,offY=0,dpr=1,cssW=1,cssH=1;

function resize(){
  const r=stage.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  H=clamp(cssH/cssW*W*(R3.on?R3.hk:1),600,880);scale=Math.min(cssW/W,cssH/H);offX=(cssW-W*scale)/2;offY=(cssH-H*scale)/2;
  initBackground();

}
function initBackground(){
  stars=[];
  [[70,.7,26],[45,1.1,70],[24,1.7,150],[16,1.2,300]].forEach(([n,sz,sp],li)=>{for(let i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),sz:sz*rnd(.6,1.2),sp:sp*rnd(.85,1.15),tw:rnd(0,TAU),ts:rnd(1,3),l:li});});
  setWorld(world);
}
function newPlanet(init,i){
  const spr=planetSprite(world,rint(0,5));

function updateBackground(dt){
  const target=state==='finale'?(fin&&fin.t>1.2?7:1.6):state==='complete'?1.2:state==='play'?(player&&player.boost?2.5:1):.55;
  scrollMul=lerp(scrollMul,target,Math.min(1,dt*3));
  nebY=(nebY+14*scrollMul*dt)%1200;
  for(const s of stars){s.y+=s.sp*scrollMul*dt;if(s.y>H+4){s.y=-4;s.x=rnd(0,W);}}
  for(let i=0;i<planets.length;i++){const p=planets[i];p.y+=p.sp*scrollMul*dt;if(p.y-p.sz*.7>H)planets[i]=newPlanet(false,i);}
}
function drawBackground(){
  const c=ctx;
  c.fillStyle='#04050c';c.fillRect(0,0,W,H);
  if(nebula){c.globalAlpha=.95;const oy=nebY-1200;for(let y=oy;y<H;y+=1200){c.drawImage(nebula,0,y,W,1200);}c.globalAlpha=1;}
  for(const p of planets){c.drawImage(p.spr,p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  const tt=time;
  for(const s of stars){
    if(s.l===3){c.globalAlpha=.16;c.fillStyle='#bcd2ff';c.fillRect(s.x,s.y,s.sz,s.sz*(7+scrollMul*3));continue;}
    const a=s.l===0?.55:.8+.2*Math.sin(tt*s.ts+s.tw);
    c.globalAlpha=a;c.fillStyle=s.l===2?'#d8e6ff':'#ffffff';
    if(s.l===2&&scrollMul>1.4){c.fillRect(s.x,s.y,s.sz,s.sz*(2+scrollMul*2.2));}else c.fillRect(s.x,s.y,s.sz,s.sz);
  }
  c.globalAlpha=1;
}

function drawShip(c,x,y,s,o){

    c.fillStyle='#7a4f3a';const RP=[[3,2],[8,6],[7,13],[2,10]];poly(c,RP);c.fill();poly(c,RP.map(q=>[-q[0],q[1]]));c.fill();

function spawnGroup(){
  const L=level,types=Object.keys(ET).filter(k=>ET[k].unlock<=L);
  let tot=0;const ws=types.map(k=>{const w=ET[k].w*(ET[k].unlock>L-6?1.4:1);tot+=w;return w;});
  let r=Math.random()*tot,pick=types[0];
  for(let i=0;i<types.length;i++){r-=ws[i];if(r<=0){pick=types[i];break;}}
  let cnt={drone:rint(2,4+Math.floor(L/15)),zig:rint(2,5),gunner:rint(1,3),diver:rint(2,3),tank:rint(1,2),splitter:rint(1,2),weaver:1,hunter:1}[pick];
  cnt=Math.min(cnt,run.budget-run.spawned);
  for(let k=0;k<cnt;k++){
    const x=clamp(W*(k+1)/(cnt+1)+rnd(-18,18),24,W-24);
    enemies.push(makeEnemy(pick,x,-30-(pick==='drone'?0:k*26)));run.spawned++;

}

}

/* ----- player update ----- */
function updatePlayer(dt){
  const p=player,S=p.S;
  p.boost=input.boost&&!p.exh&&p.stam>0&&p.alive;
  const spd=S.speed*(p.pw.speed>0?1.35:1)*(p.boost?1.5:1);
  const kx=keys.right-keys.left,ky=keys.down-keys.up;
  if(kx||ky){const l=Math.hypot(kx,ky);p.tx=clamp(p.x+kx/l*90,22,W-22);p.ty=clamp(p.y+ky/l*90,H*.28,H-48);}
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=Math.min(d,spd*dt);
  const ox=p.x;
  if(d>.01){p.x+=dx/d*st;p.y+=dy/d*st;}
  p.vx=lerp(p.vx,(p.x-ox)/Math.max(dt,.001),Math.min(1,dt*10));

  if(p.boost){p.stam-=38*dt;p.regenT=.7;if(p.stam<=0){p.stam=0;p.exh=true;}}
  else{p.regenT-=dt;if(p.regenT<=0)p.stam=Math.min(S.maxStam,p.stam+S.regen*dt);if(p.exh&&p.stam>S.maxStam*.25)p.exh=false;}
  if(p.inv>0)p.inv-=dt;if(p.flash>0)p.flash-=dt;if(p.hurtT>0)p.hurtT-=dt;
  for(const k in p.pw)if(p.pw[k]>0)p.pw[k]-=dt;
  if(p.shield&&p.shield.type==='gold'){p.shield.time-=dt;if(p.shield.time<=0)p.shield=null;}
  // skills
  const sk=p.sk;
  if(sk.cd>0)sk.cd-=dt;
  if(sk.od>0)sk.od-=dt;if(sk.slow>0)sk.slow-=dt;if(sk.aeg>0)sk.aeg-=dt;
  if(sk.beam>0){sk.beam-=dt;beamTick(dt);}
  if(sk.dr>0){sk.dr-=dt;sk.drT-=dt;if(sk.drT<=0){sk.drT=.4;for(const sx of[-1,1])bullets.push({x:p.x+sx*38,y:p.y-4,vx:0,vy:-600,dmg:S.dmg*.6,col:'#7dff9a'});}}
  if(sk.gv){
    const g=sk.gv;g.t-=dt;g.tk-=dt;const R=150;
    for(let i=ebul.length-1;i>=0;i--){const b=ebul[i],dx=g.x-b.x,dy=g.y-b.y,d=Math.hypot(dx,dy);
      if(d<R){const k=420*dt/Math.max(d,1);b.x+=dx*k;b.y+=dy*k;if(d<26){sparks(b.x,b.y,'#b07bff',2);ebul.splice(i,1);}}}
    for(const m of meteors){const dx=g.x-m.x,dy=g.y-m.y,d=Math.hypot(dx,dy);if(d<R){m.x+=dx/Math.max(d,1)*120*dt;m.y+=dy/Math.max(d,1)*120*dt;}}
    if(g.tk<=0){g.tk=.25;
      for(const e of enemies)if(Math.hypot(e.x-g.x,e.y-g.y)<R+e.sz){e.hp-=50*(1+.06*level)*.12;e.flash=.05;}
      for(const m of meteors)if(Math.hypot(m.x-g.x,m.y-g.y)<R)m.hp-=40;
      if(boss&&boss.state==='fight'&&Math.hypot(boss.x-g.x,boss.y-g.y)<R+boss.sz)hitBoss(boss.max*.0018,g.x,g.y);}
    if(g.t<=0)sk.gv=null;
  }
  if(sk.br){const b=sk.br;b.t-=dt;if(b.t<=0&&b.n>0){b.n--;b.t=.09;b.s*=-1;
      bullets.push({x:p.x+b.s*14,y:p.y-4,vx:b.s*(90+b.n*14),vy:-220,dmg:S.dmg*3,col:'#ff8a5a',type:'missile',life:3,splash:52,tgt:null,tt:0});sfx('missile');}
    if(b.n<=0)sk.br=null;}
  // fire
  p.cd-=dt;

  if(p.trailT<=0){p.trailT=.035;parts.push({k:0,x:p.x+rnd(-2,2),y:p.y+19,vx:rnd(-12,12),vy:rnd(80,160)*(p.boost?1.8:1),life:.28,max:.28,sz:rnd(1.2,2.6),col:tierOf()===0?'#ff9a3c':'#ffb02e'});}
}
const laserCol=()=>{const w=WEAPONS.find(x=>x.id===(save.weapon||'pulse'));return save.weapon&&save.weapon!=='pulse'?w.col:(tierOf()===0?'#ffe39a':accent());};
const WDELAY={pulse:1,spread:1.25,plasma:2.3,missile:1.8,arc:1.1};
function dmgTarget(o,dmg){

function fireWeapon(p,dm){

      sfx('missile');break;}

    default:{
      for(let i=0;i<n;i++){const off=i-(n-1)/2,ang=off*.05;bullets.push({x:p.x+off*8.5,y:p.y-18,vx:Math.sin(ang)*640,vy:-Math.cos(ang)*640,dmg:d,col});}

/* Arc lightning: it only ever locks onto enemies and bosses (never meteors, unless nothing else is on screen).
   Every extra shot from the Cannon upgrade or the Multi-shot power-up fires an additional, independent bolt at a different target. */
function fireArc(p,d,n){
  const arcs=clamp(Math.round((n+1)/2),1,4),bounces=1+Math.ceil(Math.min(5,p.S.shots)/2);
  const live=o=>o.hp>0&&o.y<=p.y+10&&o.y>=-20;
  let pool=enemies.filter(live);pool.push(...foes.filter(f=>f.k==='pylon'&&live(f)));if(boss&&boss.state==='fight')pool.push(boss);
  if(!pool.length)pool=meteors.filter(live);                       /* nothing to hit: at least clear the road */
  if(!pool.length){p.cd=.1;return;}
  const dist=o=>Math.hypot(o.x-p.x,(o.y-p.y)*.7);
  pool.sort((a,b)=>dist(a)-dist(b));
  const reach=pool.filter(o=>dist(o)<460);if(!reach.length){p.cd=.1;return;}
  const hitSet=new Set();let any=false;
  for(let ai=0;ai<arcs;ai++){
    const first=reach.find(o=>!hitSet.has(o))||reach[ai%reach.length],dup=hitSet.has(first);
    const chain=[first];let cur=first;hitSet.add(first);
    for(let k=0;k<bounces;k++){
      let best=null,bd=150;
      for(const o of enemies){if(chain.includes(o)||o.hp<=0)continue;const dd=Math.hypot(o.x-cur.x,o.y-cur.y);if(dd<bd){bd=dd;best=o;}}
      if(boss&&boss.state==='fight'&&!chain.includes(boss)){const dd=Math.hypot(boss.x-cur.x,boss.y-cur.y)-boss.sz*.6;if(dd<bd){bd=dd;best=boss;}}
      if(!best)break;chain.push(best);cur=best;hitSet.add(best);
    }
    let px=p.x+(ai-(arcs-1)/2)*11,py=p.y-14;
    chain.forEach((o,i)=>{dmgTarget(o,d*(i===0?1.15:.75)*(dup?.6:1));bolts.push({x1:px,y1:py,x2:o.x,y2:o.y,life:.14,max:.14});px=o.x;py=o.y;});
    any=true;
  }
  if(any)sfx('arc');
}
function explodeMissile(b){
  boom(b.x,b.y,17,'#ff8a5a',16);sfx('rock');
  for(const o of enemies.concat(meteors,foes.filter(f=>f.sh))){if(Math.hypot(o.x-b.x,o.y-b.y)<b.splash+(o.sz||o.r)*.6){o.hp-=b.dmg*.6;o.flash=.06;}}
  if(boss&&boss.state==='fight'&&Math.hypot(boss.x-b.x,boss.y-b.y)<b.splash+boss.sz*.8)hitBoss(b.dmg*.6,b.x,b.y);

function beamTick(dt){

  for(const e of enemies)if(e.y<p.y&&Math.abs(e.x-p.x)<e.sz+half){e.hp-=pw*dt;e.flash=.05;}
  for(const m of meteors)if(m.y<p.y&&Math.abs(m.x-p.x)<m.r+half){m.hp-=pw*dt*1.5;m.flash=.05;}
  for(const f of foes)if(f.sh&&f.y<p.y&&Math.abs(f.x-p.x)<f.r+half){f.hp-=pw*dt;f.flash=.05;}
  if(boss&&boss.state==='fight'&&Math.abs(boss.x-p.x)<boss.sz+half)hitBoss(pw*dt*.7,p.x,boss.y+boss.sz*.7);
  for(let i=ebul.length-1;i>=0;i--){const b=ebul[i];if(b.y<p.y&&Math.abs(b.x-p.x)<half+b.r){sparks(b.x,b.y,'#9ff3ff',2);ebul.splice(i,1);}}
  if(Math.random()<.6)parts.push({k:0,x:p.x+rnd(-12,12),y:rnd(0,p.y),vx:rnd(-30,30),vy:rnd(-60,60),life:.3,max:.3,sz:rnd(1,2.2),col:'#9ff3ff'});

/* ----- enemy update ----- */
function patrol(e,dt){
  const tx=clamp(e.bx+Math.sin(e.t*e.fr*.5+e.ph)*e.amp,26,W-26);
  e.x+=(tx-e.x)*Math.min(1,dt*3);
  const ty=e.stopY+Math.sin(e.t*.9+e.ph)*16;
  e.y+=(ty-e.y)*Math.min(1,dt*2);
}
function updEnemy(e,dt){
  e.t+=dt;if(e.flash>0)e.flash-=dt;
  const sp=ebSpeed(),p=player;
  if(e.type==='diver'){
    if(e.mode===0){
      if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}else patrol(e,dt);
      e.cd-=dt;if(e.cd<=0&&e.arrived){e.mode=1;e.t=0;}
    }else if(e.mode===1){
      e.flash=(Math.floor(e.t*14)%2)?.04:0;
      if(e.t>.7){e.mode=2;e.t=0;const a=aim(e.x,e.y,p.x,p.y),v=380+level*2;e.dash=[Math.cos(a)*v,Math.sin(a)*v];sfx('eshot');}
    }else if(e.mode===2){
      e.x+=e.dash[0]*dt;e.y+=e.dash[1]*dt;
      if(e.t>.85||e.y>H-40||e.x<14||e.x>W-14){e.mode=3;e.t=0;}
    }else{
      const tx=clamp(e.bx,30,W-30),dx=tx-e.x,dy=e.stopY-e.y,d=Math.hypot(dx,dy)||1,v=240;
      e.x+=dx/d*Math.min(d,v*dt);e.y+=dy/d*Math.min(d,v*dt);
      if(d<10){e.mode=0;e.arrived=true;e.t=0;e.cd=rnd(1.4,2.8);}
    }
    return;
  }
  if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}
  else patrol(e,dt);
  if(e.y<24)return;
  if(e.fireT>0){e.fireT-=dt;if(e.fireT<=0)enemyFire(e);}
}
/* Enemies do not shoot at random: they charge (glowing ring), then a whole volley is released on the beat.
   Between beats there is a quiet window, and each volley has a readable shape with a gap. */
const beatLen=()=>Math.max(.78,1.6-level*.009)*(1+(1-ease())*.6);
const maxShooters=()=>level<4?1:2+Math.floor(level/15);
function updBeat(dt){
  if(run.done)return;
  run.beatT-=dt;
  if(run.beatT>0)return;
  run.beatT=beatLen();run.beatN++;
  let k=0;
  for(const e of enemies){if(e.sel){e.sel=false;e.fireT=.02+k*.07;e.rest=e.every;e.lastB=run.beatN;k++;}}
  const cand=enemies.filter(e=>e.type!=='diver'&&e.arrived&&e.y>24&&e.canShoot!==false);
  for(const e of cand)if(e.rest>0)e.rest--;
  const el=cand.filter(e=>e.rest<=0).sort((a,b)=>a.lastB-b.lastB||a.x-b.x);
  for(let i=0;i<Math.min(maxShooters(),el.length);i++)el[i].sel=true;
}
function enemyFire(e){
  const sp=ebSpeed(),p=player;if(!p||!p.alive||run.done)return;
  switch(e.type){
    case 'drone':
      ebShoot(e.x,e.y+e.sz*.8,aim(e.x,e.y,p.x,p.y),sp*.85,{col:'#ff9a3c'});sfx('eshot');break;
    case 'zig':
      ebShoot(e.x,e.y+e.sz,Math.PI/2,sp,{k:'laser',col:'#ff4a6a'});sfx('eshot');break;
    case 'gunner':{
      const a=aim(e.x,e.y,p.x,p.y),n=1+(e.tier>=2?1:0)+(e.elite?1:0)+(level>25?1:0);

    case 'tank':{

      for(let i=0;i<n;i++)ebShoot(e.x,e.y+e.sz,Math.PI/2+(i-(n-1)/2)*.26,sp*.85);sfx('eshot');break;}
    case 'splitter':
      ebShoot(e.x,e.y+e.sz*.7,aim(e.x,e.y,p.x,p.y),sp*.8,{col:'#ffcf5a'});sfx('eshot');break;

      for(let i=0;i<n;i++){if(((i-gi+n)%n)<3)continue;ebShoot(e.x,e.y,off+i*TAU/n,sp*.62,{col:'#ffcf5a'});}

    case 'hunter':

  }
}
function updLanes(dt){
  for(let i=lanes.length-1;i>=0;i--){const l=lanes[i];l.life-=dt;l.age=(l.age||0)+dt;if(l.k==='strip')l.y+=l.vy*dt;else l.t+=dt;if(l.life<=0)lanes.splice(i,1);}

/* ----- boss ----- */
const PATS=['aimed','fan','ring','spiral','sweep','homing','rain','cross','walls','snipe'];

/* ============ boss weapons that are NOT bullets: beams, curtains, blades, mines, gravity wells, hazard zones, shockwaves,

const foe=o=>{o.age=0;o.col=o.col||'#ff4d6a';if(o.hp!==undefined){o.hpMax=o.hp;o.sh=true;}foes.push(o);return o;};

const hrad=()=>8*player.S.hitR;

function pushShip(p,dx,dy){

const fhp=k=>22*k*(1+level*.06)*ease();
const fsp=()=>ebSpeed()*(.9+(boss?boss.b:1)*.01);
const fbs=(x,y,a,s,o)=>{o=o||{};if(!o.col)o.col=boss?boss.col:'#ff9a3c';o.dm=(o.dm||1)*1.45;return ebShoot(x,y,a,s,o);};
const bdiff=()=>clamp(((boss?boss.b:1)-1)/19,0,1);
const beam=o=>foe(Object.assign({k:'beam',w:22,charge:.9,dur:.55,ang:Math.PI/2,spin:0,track:0,off:0,lockT:0,keep:0,bounce:0,own:0,dx:0,dy:0,ox:0,oy:0,col:'#ff4d6a'},o));
function beamSegs(f){
  let x=f.ox,y=f.oy,a=f.ang;const out=[],n=(f.bounce|0)+1;
  for(let i=0;i<n;i++){
    const dx=Math.cos(a),dy=Math.sin(a);let t=2400;
    if(dx>1e-4)t=Math.min(t,(W-x)/dx);else if(dx<-1e-4)t=Math.min(t,(0-x)/dx);
    if(dy>1e-4)t=Math.min(t,(H+30-y)/dy);else if(dy<-1e-4)t=Math.min(t,(-30-y)/dy);
    t=Math.max(t,0);const x2=x+dx*t,y2=y+dy*t;out.push([x,y,x2,y2]);
    if(i<n-1&&(x2<=.5||x2>=W-.5)&&y2>-20){x=x2;y=y2;a=Math.PI-a;}else break;
  }
  return out;
}
function foePop(f,coins){
  boom(f.x,f.y,(f.r||12)*1.4,f.col,12);sfx('boom');kick(.1,0);
  dropCoins(f.x,f.y,Math.max(1,Math.round(1+level/14)),coins||1);
}
function foeBlast(f){
  boom(f.x,f.y,f.blast*.4,f.col,18);rings.push({x:f.x,y:f.y,r:8,max:f.blast,life:.3,maxl:.3,col:f.col});sfx('boom');addShake(4);
  if(player.alive&&Math.hypot(player.x-f.x,player.y-f.y)<f.blast+4)hurt(1,'mine');
  for(let i=0;i<(f.frag|0);i++)fbs(f.x,f.y,i*TAU/f.frag+f.x*.02,fsp()*.5,{r:4,col:'#ffb0a0'});
}
/* a player shot that reaches the boss while its mirror is up bounces back at the ship */
function bossMirrorHit(b){
  sparks(b.x,b.y,'#cfe8ff',4);
  if(boss.mirT>0)return;boss.mirT=.28;
  if(player&&player.alive){fbs(b.x,b.y,aim(b.x,b.y,player.x,player.y)+rnd(-.08,.08),fsp()*.9,{col:'#cfe8ff',r:5});sfx('shieldHit');}
}
function foesClear(only){
  if(only){foes=foes.filter(f=>!only.includes(f.k));return;}
  foes=[];if(boss){boss.mirror=0;boss.mirWind=0;boss.guard=0;}
}
function updFoes(dt){
  const p=player;if(!p)return;
  if(boss){boss.guard=0;if(boss.mirWind>0)boss.mirWind-=dt;if(boss.mirror>0)boss.mirror-=dt;if(boss.mirT>0)boss.mirT-=dt;}
  if(p.jam>0)p.jam-=dt;
  for(let i=foes.length-1;i>=0;i--){
    const f=foes[i];f.age+=dt;let dead=false;
    switch(f.k){
      case 'beam':{
        if(f.own){if(!boss){dead=true;break;}f.ox=boss.x+f.dx;f.oy=boss.y+boss.sz*.45+f.dy;}
        if(f.track&&p.alive&&(f.keep||f.age<f.charge-f.lockT)){const want=aim(f.ox,f.oy,p.x,p.y)+f.off;f.ang+=clamp(nrm(want-f.ang),-f.track*dt,f.track*dt);}
        if(f.age>=f.charge)f.ang+=f.spin*dt;
        const fire=f.age>=f.charge&&f.age<f.charge+f.dur;
        if(f.age>=f.charge&&!f.on){f.on=1;sfx('boom');addShake(4);kick(.22,.02);if(f.onFire)f.onFire(f);}
        if(fire&&p.alive){for(const s of beamSegs(f)){if(dseg(p.x,p.y,s[0],s[1],s[2],s[3])<f.w/2+hrad()*.6){hurt(1,'beam');break;}}}
        if(f.age>f.charge+f.dur+.22)dead=true;
        break;}
      case 'cur':{
        if(f.age>=f.arm){
          f.y+=f.vy*dt;f.gx+=f.gv*dt;const lo=f.gw/2+16,hi=W-f.gw/2-16;
          if(f.gx<lo){f.gx=lo;f.gv=Math.abs(f.gv);}if(f.gx>hi){f.gx=hi;f.gv=-Math.abs(f.gv);}
          if(p.alive&&Math.abs(p.y-f.y)<f.w/2+hrad()*.6&&Math.abs(p.x-f.gx)>f.gw/2-6)hurt(1,'gate');
          if(f.y>H+30)dead=true;
        }
        break;}
      case 'blade':{
        f.spin+=dt*14;
        if(f.st===0){
          const u=Math.min(1,f.age/f.out),e=1-Math.pow(1-u,2),bx=f.sx+(f.tx-f.sx)*e,by=f.sy+(f.ty-f.sy)*e;
          const dx=f.tx-f.sx,dy=f.ty-f.sy,L=Math.hypot(dx,dy)||1,off=Math.sin(Math.PI*u)*f.curve;
          f.x=bx-dy/L*off;f.y=by+dx/L*off;if(u>=1){f.st=1;f.t1=0;sfx('rock');}
        }else if(f.st===1){
          f.t1+=dt;if(f.t1>=f.hold){f.st=2;f.t2=0;f.v=140;}if(Math.random()<dt*30)sparks(f.x,f.y,f.col,1);
        }else{
          f.t2+=dt;f.v=Math.min(430,f.v+560*dt);
          const tx=boss?boss.x:W/2,ty=boss?boss.y+boss.sz*.3:150,a=aim(f.x,f.y,tx,ty),d=Math.hypot(tx-f.x,ty-f.y);
          f.x+=Math.cos(a)*f.v*dt;f.y+=Math.sin(a)*f.v*dt;
          if(d<(boss?boss.sz*.5:20)+10||f.t2>5){rings.push({x:f.x,y:f.y,r:6,max:34,life:.25,maxl:.25,col:f.col});dead=true;}
        }
        if(f.age>.3&&p.alive&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+hrad())hurt(1,'blade');
        break;}
      case 'mine':{
        f.x+=f.vx*dt;f.y+=f.vy*dt;const dm=Math.max(0,1-f.damp*dt);f.vx*=dm;f.vy*=dm;
        if(f.drift&&p.alive&&f.age>1){const a=aim(f.x,f.y,p.x,p.y);f.x+=Math.cos(a)*f.drift*dt;f.y+=Math.sin(a)*f.drift*dt;}
        f.x=clamp(f.x,14,W-14);f.y=clamp(f.y,40,H-60);
        if(f.hp<=0){foePop(f);dead=true;break;}
        if(f.age>=f.fuse){foeBlast(f);dead=true;}
        break;}
      case 'well':{
        if(f.age>=f.arm&&p.alive){
          const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);
          if(d<f.R&&d>1){const k=f.pull*(1-.55*d/f.R)*dt/d;pushShip(p,dx*k,dy*k);}
          if(d<f.core+hrad()*.5)hurt(1,'well');
        }
        if(f.age>=f.arm+f.life){
          boom(f.x,f.y,22,f.col,16);rings.push({x:f.x,y:f.y,r:8,max:f.R*.9,life:.4,maxl:.4,col:f.col});sfx('boom');addShake(4);
          for(let j=0;j<(f.burst|0);j++)fbs(f.x,f.y,j*TAU/f.burst+f.x*.01,fsp()*.5,{r:5,col:'#e1c4ff'});
          dead=true;
        }
        break;}
      case 'wave':{
        f.R+=f.vr*dt;
        if(p.alive&&!f.done){
          const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy);
          if(Math.abs(d-f.R)<f.th/2+hrad()*.6&&Math.abs(nrm(Math.atan2(dy,dx)-f.ga))>f.gw){
            f.done=1;if(f.jam){p.jam=1.4;floatText(p.x,p.y-30,save.set.lang==='ar'?'تعطّل السلاح':'WEAPONS JAMMED','#ffe27a');sfx('shield');}
            hurt(1,'wave');
          }
        }
        if(f.R>f.max)dead=true;
        break;}
      case 'zone':{
        if(f.age>=f.arm){
          if(f.age>=f.arm+f.life){dead=true;break;}
          if(p.alive&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+hrad()*.5)hurt(1,'zone');
          if(Math.random()<dt*16)parts.push({k:0,x:f.x+rnd(-f.r,f.r)*.8,y:f.y+rnd(-f.r,f.r)*.8,vx:rnd(-8,8),vy:rnd(-70,-30),life:.5,max:.5,sz:rnd(1.2,2.4),col:f.col});
        }
        break;}
      case 'msl':{
        if(f.hp<=0){foePop(f,2);dead=true;break;}
        const a=Math.atan2(f.vy,f.vx),sp0=Math.min(f.max,Math.hypot(f.vx,f.vy)+f.acc*dt);
        let na=a;if(p.alive&&f.age>.35)na=a+clamp(nrm(aim(f.x,f.y,p.x,p.y)-a),-f.turn*dt,f.turn*dt);
        f.vx=Math.cos(na)*sp0;f.vy=Math.sin(na)*sp0;f.ang=na;f.x+=f.vx*dt;f.y+=f.vy*dt;
        if(Math.random()<dt*45)parts.push({k:0,x:f.x-Math.cos(na)*9,y:f.y-Math.sin(na)*9,vx:rnd(-12,12),vy:rnd(-12,12),life:.3,max:.3,sz:rnd(1.4,2.6),col:'#ffb066'});
        if(p.alive&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+hrad()){boom(f.x,f.y,20,f.col,14);sfx('boom');addShake(5);hurt(1,'torpedo');dead=true;}
        else if(f.age>f.life||f.y>H+40||f.x<-40||f.x>W+40||f.y<-80){rings.push({x:f.x,y:f.y,r:5,max:26,life:.25,maxl:.25,col:f.col});dead=true;}
        break;}
      case 'pylon':{
        if(!boss){dead=true;break;}
        if(f.hp<=0){foePop(f,5);boss.sentT=run.t+9;dead=true;break;}
        f.x+=(f.hx-f.x)*Math.min(1,dt*3);f.y+=(f.hy-f.y)*Math.min(1,dt*3);
        boss.guard=(boss.guard||0)+1;
        f.fire-=dt;
        if(f.fire<=0&&f.age>1.2&&p.alive){f.fire=f.every;const q=aim(f.x,f.y,p.x,p.y);for(let j=-1;j<=1;j++)fbs(f.x,f.y+8,q+j*.16,fsp()*.95,{k:'laser',r:4,col:'#ffd27a'});sfx('eshot');}
        break;}
      case 'orbit':{
        f.R+=f.vr*dt;f.ang+=(f.v/Math.max(60,f.R))*f.dir*dt;
        f.x=f.cx+Math.cos(f.ang)*f.R;f.y=f.cy+Math.sin(f.ang)*f.R*.9;
        if(f.age>.5&&p.alive&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+hrad())hurt(1,'orbit');
        if(f.age>=f.life||f.x<-60||f.x>W+60||f.y>H+60)dead=true;
        break;}
      case 'hex':{
        const nd=hexNodes(f);

      case 'wind':{

}
function hexNodes(f){
  const u=clamp((f.age-f.arm)/f.shrink,0,1),R=f.R0+(f.R1-f.R0)*u,rot=f.rot+f.spin*f.age,n=[];

  return n;
}

/* ----- drawing (P projects a game point to the screen, K gives pixels per game unit there) ----- */
const fpoly=(c,P,pts)=>{c.beginPath();pts.forEach((q,i)=>{const s=P(q[0],q[1]);i?c.lineTo(s[0],s[1]):c.moveTo(s[0],s[1]);});c.closePath();};
const fcirc=(c,P,x,y,r,n)=>{n=n||28;c.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,s=P(x+Math.cos(a)*r,y+Math.sin(a)*r);i?c.lineTo(s[0],s[1]):c.moveTo(s[0],s[1]);}};

function fglow(c,P,K,x,y,col,r,al){const s=P(x,y),k=K(x,y);c.globalCompositeOperation='lighter';c.globalAlpha=al;c.drawImage(glow(col),s[0]-r*k,s[1]-r*k,r*2*k,r*2*k);}
function fbar(c,P,K,f){
  if(f.hp>=f.hpMax)return;const s=P(f.x,f.y),k=K(f.x,f.y),w=f.r*2.2*k,y=s[1]-(f.r+9)*k;
  c.globalCompositeOperation='source-over';c.globalAlpha=1;c.fillStyle='rgba(0,0,0,.65)';c.fillRect(s[0]-w/2,y,w,4);c.fillStyle='#ffd24a';c.fillRect(s[0]-w/2,y,w*Math.max(0,f.hp/f.hpMax),4);
}
function foeDraw(c,P,K){
  const B=boss,pl=player;

  const tm=time;
  c.save();c.lineCap='round';c.lineJoin='round';
  for(const f of foes){
    switch(f.k){
      case 'beam':{
        const chg=f.age<f.charge,u=chg?f.age/f.charge:1,fl=.5+.5*Math.sin(f.age*(16+40*u)),segs=beamSegs(f);
        for(const s of segs){
          const a=P(s[0],s[1]),b=P(s[2],s[3]),kk=(K(s[0],s[1])+K(s[2],s[3]))/2;
          c.globalCompositeOperation='lighter';
          if(chg){
            const dx=s[2]-s[0],dy=s[3]-s[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*f.w/2,ny=dx/L*f.w/2;

            c.globalAlpha=.35+.5*u;c.strokeStyle='#fff';c.lineWidth=1+2.2*u;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
          }else{
            const e=f.age-f.charge,al=e<f.dur?1:clamp(1-(e-f.dur)/.22,0,1),wp=f.w*kk*(1+.1*Math.sin(f.age*60))*(1+(1-clamp(e/.1,0,1))*.7);
            c.strokeStyle=f.col;c.globalAlpha=.35*al;c.lineWidth=wp*2.1;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();

            c.strokeStyle='#fff';c.globalAlpha=al;c.lineWidth=wp*.38;c.stroke();
          }
        }
        if(chg&&f.spin&&!f.bounce){   /* faint wedge: the area this sweeping beam is about to cover */

        break;}
      case 'cur':{

        for(const [xa,xb] of [[-320,x1],[x2,W+320]]){

        c.globalCompositeOperation='source-over';c.globalAlpha=1;
        c.fillStyle='#241018';c.strokeStyle=f.col;c.lineWidth=2;c.beginPath();c.arc(s[0],s[1],r,0,TAU);c.fill();c.stroke();
        c.lineWidth=2;for(let j=0;j<8;j++){const an=j*Math.PI/4+f.age;c.beginPath();c.moveTo(s[0]+Math.cos(an)*r,s[1]+Math.sin(an)*r);c.lineTo(s[0]+Math.cos(an)*r*1.5,s[1]+Math.sin(an)*r*1.5);c.stroke();}

        c.globalCompositeOperation='lighter';
        fcirc(c,P,f.x,f.y,f.R,32);c.globalAlpha=a*.7;c.strokeStyle='#c9a6ff';c.lineWidth=2;c.setLineDash([10,9]);c.lineDashOffset=-tm*30;c.stroke();c.setLineDash([]);
        c.globalCompositeOperation='source-over';
        const g=c.createRadialGradient(s[0],s[1],4*k,s[0],s[1],R);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.3,'rgba(26,8,56,.7)');g.addColorStop(1,'rgba(120,70,255,0)');
        c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(s[0],s[1],R,0,TAU);c.fill();
        c.globalCompositeOperation='lighter';c.lineWidth=Math.max(2,3*k);
        for(let j=0;j<4;j++){c.save();c.translate(s[0],s[1]);c.rotate(-tm*3.2+j*Math.PI/2);c.strokeStyle='rgba(190,140,255,'+(.6*a).toFixed(3)+')';c.beginPath();for(let t2=0;t2<1;t2+=.05){const r2=(6+t2*f.R*.9)*k,an=t2*4.2;c.lineTo(Math.cos(an)*r2,Math.sin(an)*r2);}c.stroke();c.restore();}

      case 'wave':{
        const al=clamp((f.max-f.R)/90,0,1)*clamp(f.age/.12,0,1),k=K(f.x,f.y+f.R*.3);

        c.strokeStyle=f.col;c.globalAlpha=.3*al;c.lineWidth=f.th*1.9*k;c.stroke();

/* idle motion between attacks differs per boss */
function idlePos(B,p){
  const t=B.t,A=Math.max(30,W/2-B.sz-14);
  switch(B.kit.idle){
    case 'still':return[W/2+Math.sin(t*.35)*Math.min(A,60),138+Math.sin(t*.8)*8];
    case 'strafe':return[W/2+Math.sin(t*B.sw*2.1)*A,150+Math.sin(t*.9)*10];
    case 'orbit':return[W/2+Math.cos(t*.7)*Math.min(A,95),178+Math.sin(t*.7)*42];
    case 'hover':return[W/2+Math.sin(t*B.sw*.8)*A,165+Math.sin(t*1.7)*34];
    case 'chase':return[clamp(W/2+(p.x-W/2)*.75,B.sz+14,W-B.sz-14),145+Math.sin(t*.9)*14];
    default:return[W/2+Math.sin(t*B.sw)*A,150+Math.sin(t*.9)*14];
  }
}

/* red telegraph shapes: always visible, fade in, flash faster as the attack gets close */
function teleDraw(c,l,P){
  const u=l.age||0,a=clamp(u*6,0,1)*(l.life>.08?1:l.life/.08),fl=.55+.45*Math.sin(u*(14+34*u/l.max));
  let pts;
  if(l.shape==='row')pts=[[0,l.y-l.h/2],[W,l.y-l.h/2],[W,l.y+l.h/2],[0,l.y+l.h/2]];
  else if(l.shape==='col')pts=[[l.x-l.w/2,0],[l.x+l.w/2,0],[l.x+l.w/2,H],[l.x-l.w/2,H]];
  else if(l.shape==='ray'){const dx=Math.cos(l.ang),dy=Math.sin(l.ang),nx=-dy*l.w/2,ny=dx*l.w/2,L=800;pts=[[l.x+nx,l.y+ny],[l.x+dx*L+nx,l.y+dy*L+ny],[l.x+dx*L-nx,l.y+dy*L-ny],[l.x-nx,l.y-ny]];}
  else{pts=[];for(let i=0;i<18;i++)pts.push([l.x+Math.cos(i/18*TAU)*l.r,l.y+Math.sin(i/18*TAU)*l.r]);}
  c.save();c.beginPath();pts.forEach((q,i)=>{const s=P(q[0],q[1]);if(i)c.lineTo(s[0],s[1]);else c.moveTo(s[0],s[1]);});c.closePath();
  c.globalAlpha=a*(.34+.2*fl);c.fillStyle='#ff2d4d';c.fill();c.globalAlpha=a*(.7+.3*fl);c.strokeStyle='#ffb3bf';c.lineWidth=3;c.stroke();c.restore();
}

const MET=[];
function meteorGeo(k){
  return MET[k]||(MET[k]=(()=>{
    const g=new TH.IcosahedronGeometry(1,1),pa=g.attributes.position,rn=mulberry(k*53+9),v=[];
    for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i),key=Math.round(x*50)+','+Math.round(y*50)+','+Math.round(z*50);
      let h=0;for(let c=0;c<key.length;c++)h=(h*31+key.charCodeAt(c)+k*7)>>>0;const r=.8+((h%1000)/1000)*.3;v.push([x*r,y*r*.9,z*r]);}
    for(let i=0;i<pa.count;i++)pa.setXYZ(i,v[i][0],v[i][1],v[i][2]);
    const ng=g.toNonIndexed();ng.computeVertexNormals();
    const cols=[],cn=ng.attributes.position.count;for(let i=0;i<cn;i+=3){const sh=.7+rn()*.5;for(let j=0;j<3;j++)cols.push(sh,sh,sh);}

  })());
}

const PUI={};
function puIconTex(id){
  if(PUI[id])return PUI[id];
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d'),d=PU[id];g.translate(48,48);g.scale(3.2,3.2);
  g.fillStyle='#0b1022';g.beginPath();g.arc(0,0,12,0,TAU);g.fill();g.strokeStyle=d.col;g.lineWidth=2.4;g.beginPath();g.arc(0,0,12,0,TAU);g.stroke();
  g.fillStyle=d.col;g.strokeStyle=d.col;g.lineWidth=2;g.lineCap='round';
  if(d.sh){g.beginPath();g.moveTo(0,-7);g.lineTo(6,-4);g.lineTo(5,3);g.lineTo(0,8);g.lineTo(-5,3);g.lineTo(-6,-4);g.closePath();g.stroke();}
  else if(id==='multi'){g.fillRect(-6,-6,2.4,12);g.fillRect(-1.2,-8,2.4,14);g.fillRect(3.6,-6,2.4,12);}
  else if(id==='rapid'){g.beginPath();g.moveTo(2,-8);g.lineTo(-4,1);g.lineTo(0,1);g.lineTo(-2,8);g.lineTo(5,-2);g.lineTo(1,-2);g.closePath();g.fill();}

  else{g.fillRect(-2,-7,4,14);g.fillRect(-7,-2,14,4);}
  const t=new TH.CanvasTexture(c);t.colorSpace=TH.SRGBColorSpace;return PUI[id]=t;
}

let enemyRoot=null,meteorRoot=null,pickRoot=null,bossRoot=null;
function r3buildScene(){
  entRoot=new TH.Group();scn.add(entRoot);
  enemyRoot=new TH.Group();meteorRoot=new TH.Group();pickRoot=new TH.Group();bossRoot=new TH.Group();
  entRoot.add(meteorRoot,pickRoot,enemyRoot,bossRoot);

function r3pruneMap(root,seen){
  for(let i=root.children.length-1;i>=0;i--){const c=root.children[i];if(!seen.has(c)){root.remove(c);}}
}
const _seenE=new Set(),_seenM=new Set(),_seenP=new Set();
function r3syncEntities(dt,inGame){
  _seenE.clear();_seenM.clear();_seenP.clear();
  if(!inGame){enemyRoot.visible=meteorRoot.visible=pickRoot.visible=false;r3pruneMap(enemyRoot,_seenE);r3pruneMap(meteorRoot,_seenM);r3pruneMap(pickRoot,_seenP);return;}
  enemyRoot.visible=meteorRoot.visible=pickRoot.visible=true;
  for(const e of enemies){
    let g=e._g;if(!g){g=e._g=buildEnemy(e);enemyRoot.add(g);}
    _seenE.add(g);
    const px=e._px===undefined?e.x:e._px;const vx=dt>0?(e.x-px)/dt:0;e._px=e.x;
    e._bank=(e._bank||0)+((clamp(vx/260,-1,1))-(e._bank||0))*Math.min(1,dt*7);
    g.position.set(wX(e.x),0,wZ(e.y));
    g.rotation.z=-e._bank*.5;g.rotation.y=0;
    {const k=Math.min(1,e.t/.45);g.scale.setScalar(e.sz*(.3+.7*(1-(1-k)*(1-k))));}
    if(g.userData.spin)g.userData.spin.rotation.y=-e.t*(e.type==='weaver'?1.4:2);
    if(g.userData.orb)g.userData.orb.position.set(Math.cos(e.t*3)*1.1,.1,Math.sin(e.t*3)*.5);
    if(e.type==='diver'){g.rotation.x=e.mode===2?-.25:0;}
    setFlash(g,e.flash>0);
    const tl=g.userData.tele;
    if(e.sel&&run){const k=clamp(1-run.beatT/beatLen(),0,1);tl.visible=true;tl.scale.setScalar(1.55-.5*k);tl.material.opacity=.3+.6*k;}else tl.visible=false;
    // glows are queued for the point layer
    const gl=g.userData.glows;
    if(gl&&fxGlow)for(const q of gl)fxGlow(g.position.x+q[0]*e.sz,q[1]*e.sz+3,g.position.z+q[2]*e.sz,q[3]*e.sz*(q[4]==='#ff3d5a'&&e.sel?1.5:1),q[4],(e.type==='diver'&&e.mode>=1)?1:.8);
  }
  for(const m of meteors){
    let g=m._g;if(!g){g=m._g=new TH.Mesh(meteorGeo(m.spr),meteorMat(world));g.userData.noflash=false;meteorRoot.add(g);m._ax=[rnd(-1,1),rnd(-1,1),rnd(-1,1)];m._q=new TH.Quaternion();}
    _seenM.add(g);
    g.position.set(wX(m.x),0,wZ(m.y));g.scale.setScalar(m.r*1.04*(.3+.7*clamp((m.y+m.r*1.2)/(m.r*2+50),0,1)));
    g.rotation.set(m.rot*m._ax[0]*.8+m._ax[2],m.rot*m._ax[1],m.rot*.6);
    if(m.flash>0){g.material=FLASHM();}else g.material=meteorMat(world);
  }
  for(const k of picks){
    let g=k._g;if(!g){g=k._g=buildPickup(k);pickRoot.add(g);}
    _seenP.add(g);
    if(k.kind==='coin'){
      g.position.set(wX(k.x),4,wZ(k.y));g.userData.coin.rotation.y=k.t*4;
      if(fxGlow)fxGlow(g.position.x,6,g.position.z,16,'#ffb02e',.5);
    }else{
      const pul=1+.12*Math.sin(k.t*6);g.position.set(wX(k.x),Math.sin(k.t*3)*2,wZ(k.y));
      g.userData.ring.rotation.y=k.t*2;g.userData.ring2.rotation.y=-k.t*3;g.userData.ring.scale.setScalar(pul);g.userData.ring2.scale.setScalar(pul*1.25);
      if(fxGlow)fxGlow(g.position.x,6,g.position.z,46*pul,PU[k.id].col,.55);
    }
  }
  r3pruneMap(enemyRoot,_seenE);r3pruneMap(meteorRoot,_seenM);r3pruneMap(pickRoot,_seenP);
}

/* ---- the film's clock ----
   The film (camera paths, scene changes, sound marks) runs on its own clock c.t. The real clock c.rt drives it at a speed that is
   authored as keys [real seconds, speed] (smooth in between): the film drifts slowly while a line is read, slower still in the quiet

  const N=240,n=keys.length,last=keys[n-1],end=last[0]+80,tab=[0];
  const spd=r=>{if(r<=keys[0][0])return keys[0][1];if(r>=last[0])return last[1];let i=0;while(i<n-2&&r>keys[i+1][0])i++;

  return rt=>{if(rt<=0)return 0;const x=Math.min(rt*N,tab.length-1.001),i=Math.floor(x);return tab[i]+(tab[i+1]-tab[i])*(x-i);};

/* ============ loop ============ */
let lastTs=0,hudOn=false,lastP=-1,lastSP=-1;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-lastTs)/1000||0);lastTs=ts;time+=dt;
  updateBackground(dt);
  updHype(dt);
  if(state==='play')update(dt*hySpeed(dt));
  else if(state==='dead'){
    updFx(dt);run.deadT+=dt;
    if(run.deadT>1.3){state='revive';showRevive();}
  }
  else if(state==='finale')updFinale(dt);
  else if(state==='cine')updCine(dt);
  else if(state==='complete'){
    updFx(dt);fwT-=dt;
    if(fwT<=0){fwT=rnd(.35,.8);const hh=rint(0,359);boom(rnd(50,W-50),rnd(80,H*.5),rnd(14,24),hsl2hex(hh,85,62),30);}
  }
  else if(state==='revive')updFx(dt);
  if(state==='play')updFx(dt);
  const on=state==='play';
  if(on!==hudOn){
    hudOn=on;$('#pauseBtn').hidden=!on;$('#boostBtn').hidden=!on;if(!on)input.boost=false;
    const has=on&&player&&player.sk&&player.sk.id;$('#skillBtn').hidden=!has;
    if(has){const sd=SKILLS.find(x=>x.id===player.sk.id);$('#skillBtn span').innerHTML=icon(sd.id);$('#skillBtn').style.setProperty('--c',sd.col);lastSP=-1;}
  }
  if(on&&player&&player.sk&&player.sk.id){
    const k=player.sk,sd=SKILLS.find(x=>x.id===k.id),sp=Math.round((1-clamp(k.cd/sd.cd,0,1))*100),sbn=$('#skillBtn');
    if(sp!==lastSP){lastSP=sp;sbn.style.setProperty('--p',sp+'%');}
    sbn.classList.toggle('ready',k.cd<=0);sbn.classList.toggle('act',k.od>0||k.beam>0||k.slow>0||k.dr>0||k.aeg>0);
  }
  if(on&&player){const pr=Math.round(player.stam/player.S.maxStam*100);if(pr!==lastP){lastP=pr;$('#boostBtn').style.setProperty('--p',pr+'%');}
    $('#boostBtn').classList.toggle('on',player.boost);}
  render();
}

function runCounts(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,t0=performance.now()+(+el.dataset.delay||0),dur=900;
    const step=now=>{if(now<t0){requestAnimationFrame(step);return;}const k=clamp((now-t0)/dur,0,1);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
